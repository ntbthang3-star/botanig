<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;border:0;background:#222a10}iframe{display:block;width:100%;height:1250px;border:0}</style></head>
<body><iframe id="botaniq" src="Botaniq_v20.html" title="Botaniq"></iframe>
<script>
(function(){
  const frame=document.getElementById('botaniq');
  let lastValue=null;
  function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type:type,...data},'*');}
  function setValue(value){
    const serialized=JSON.stringify(value);
    if(serialized===lastValue)return;
    lastValue=serialized;
    send('streamlit:setComponentValue',{value:value,dataType:'json'});
  }
  window.addEventListener('message',function(event){
    const d=event.data||{};
    if(d.type==='streamlit:render'){
      const args=d.args||{};
      if(args.result && frame.contentWindow){
        frame.contentWindow.postMessage({type:'botaniq-python-result',result:args.result},'*');
      }
      if(args.height){send('streamlit:setFrameHeight',{height:args.height});}
    }
    if(d.type==='botaniq-input') setValue(d.payload);
  });
  frame.addEventListener('load',function(){send('streamlit:setFrameHeight',{height:1250});});
  send('streamlit:componentReady',{apiVersion:1});
})();
</script></body></html>
